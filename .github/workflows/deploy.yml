name: Deploy Org-Safety

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: 22
          timeout: 240s
          command_timeout: 30m

          script: |
            set -e

            echo "===== Moving to Project ====="
            cd /root/Org-safety

            echo "===== Pull Latest Code ====="
            git fetch origin
            git reset --hard origin/main

            ####################################################
            # Backend
            ####################################################
            echo "===== Backend ====="

            cd /root/Org-safety/server

            npm install

            pm2 restart org-safety-server
            
            ####################################################
            # Frontend
            ####################################################
            echo "===== Frontend ====="

            cd /root/Org-safety/client

            npm install

            npm run build

            pm2 restart org-safety-client

            ####################################################
            # Save PM2
            ####################################################
            pm2 save

            echo "===== Deployment Complete ====="
